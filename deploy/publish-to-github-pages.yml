# Publish a PublicTxt content repo with publictxt-pages via GitHub Pages.
#
# Copy into the CONTENT repo as .github/workflows/publish.yml, and set its
# Settings -> Pages -> Source to "GitHub Actions". Then edit the Build step's
# env: — HUGO_-prefixed variables override hugo.toml, so no fork is needed.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v4
        with:
          path: txt
          # Page dates come from Git history; a shallow clone gives every page one date.
          fetch-depth: 0

      - name: Check out publictxt-pages
        uses: actions/checkout@v4
        with:
          repository: publictxt/publictxt-pages   # <- adjust to wherever this repo lives
          ref: main                        # pin to a tag for reproducible builds
          path: site

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"

      - name: Set up Node (for Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        env:
          HUGO_BASEURL: https://publictxt.net/
          HUGO_TITLE: "A PublicTxt instance"
          HUGO_PARAMS_DESCRIPTION: "A PublicTxt repository — browsable, searchable, plain-text first."
          # HUGO_PARAMS_MASTODON: "https://mastodon.social/@username"   # optional, rel="me"
          # "Edit this page" links for this repo and branch; "" hides them.
          HUGO_PARAMS_EDITURL: ${{ github.server_url }}/${{ github.repository }}/edit/${{ github.ref_name }}/
        run: sh site/scripts/build.sh --source ../txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

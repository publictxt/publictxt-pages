baseURL = "https://PublicTxt.net/"
title = "A PublicTxt instance"
enableRobotsTXT = true
capitalizeListTitles = false

# Content = build/content (sync_content.py output — never edit) + site-content
# (the site's own pages, e.g. search).
[module]
  [[module.mounts]]
    source = "build/content"
    target = "content"
  [[module.mounts]]
    source = "site-content"
    target = "content"

# Sync writes `created:`/`updated:` on every page; Hugo uses .Date/.Lastmod.
[frontmatter]
  date = ["created"]
  lastmod = ["updated", "created"]
  publishDate = ["created"]

[taxonomies]
  tag = "tags"

[params]
  description = "A PublicTxt repository — browsable, searchable, plain-text first."
  # Mobile header title (optional).
  shortTitle = "PublicTxt"
  # Favicon path; or replace the file in static/.
  favicon = "favicon.png"
  # Mastodon profile URL (optional), emitted as a hidden <link rel="me"> for
  # profile verification.
  # mastodon = "https://mastodon.social/@user"
  # "Edit this page" prefix; the page's source path is appended. Empty = no link.
  # The deploy workflow sets it (HUGO_PARAMS_EDITURL).
  # editURL = "https://github.com/publictxt/publictxt-pages/edit/main/"

  # Section order in the sidebar (folder names); unlisted follow A→Z.
  # Configured: Hugo's date order would reshuffle navigation on every edit.
  sectionOrder = ["bookmarks", "blog", "wiki", "posts", "notes"]
  tagCloudLimit = 30   # sidebar tag cloud; a list's Other tags
  recentLimit = 8      # home Recent list: cards per page
  # Collections sharing one timeline on their pages, with a chip per
  # collection to narrow it; its labels link to the home list. Pages outside
  # them get their section's timeline. Empty = every page its section's.
  timelineCollections = ["blog", "posts"]
  # Tags with a chip on that shared timeline, to narrow it (include or
  # exclude), where some of its pages have the tag and some don't — entries
  # of a special kind. Not collections: nothing else changes. Section
  # timelines get none. Empty = no tag chips.
  timelineTags = ["journal"]
  # Top-level sections (folder names) whose pages show a folder tree of the
  # section in place of the timeline: reference material, read by place, not
  # date. Empty = every page a timeline.
  treeSections = ["wiki"]
  # Top-level sections (folder names) whose folder pages (the section's and
  # each sub-folder's) show their pages by year and month, with titles, above
  # the browse list: a log, read by date. Shown across two months or more.
  # Empty = none.
  timelineSections = ["blog", "posts"]
  # Browse list defaults: sort "<field> [asc|desc]" over created (newest first),
  # title (A→Z), updated, rating (top first); cards per page. A section index
  # overrides for its subtree with `order:` / `perPage:`.
  listOrder = "created"
  listPerPage = 20

  # Tables ([params.x]) from here on: a plain key below one belongs to it.

  # Footer wording, optional; "" hides a line. `text` is inline markdown;
  # `edit` labels the edit link (shown only with editURL).
  [params.footer]
    text = "[PublicTxt](https://github.com/publictxt/publictext), plain-text knowledge, published with [publictxt-pages](https://github.com/publictxt/publictxt-pages)"
    edit = "Improve this page"

  # Categories: a page's `categories:` / `category:` (a value or a list) from
  # this closed list (matched case-insensitively; unlisted values warned and
  # ignored). Disabled or absent = no categories anywhere.
  [params.categories]
    enabled = true
    list = ["Project", "Personal", "Tech", "Politics", "Science", "CompSci", "Art", "Content"]

  # Filter chips in browse lists and search, in this order. `key`: collection,
  # category or tag; leave one out to drop its chips. Absent = all three.
  # `states`: what a chip can do — ["include"] or ["exclude"] (a click
  # toggles it), or both (click includes, ✕ excludes; the default).
  # A card's tags filter only if tag includes; else they link to the tag
  # page. `match`: how two or more includes combine, "all" and/or "any", the
  # first the default; one fixes it, hiding the toggle. Default ["all", "any"].
  # Changing a default changes what shared links without `-match` mean.
  [[params.chipFacets]]
    key = "collection"
    label = "Collection"
    states = ["include", "exclude"]
    match = ["any"]
  [[params.chipFacets]]
    key = "category"
    label = "Category"
    states = ["include"]
    match = ["any"]
  [[params.chipFacets]]
    key = "tag"
    label = "Tags"

  # Post sources: front matter keys holding a URL (or list) where a page was
  # also posted, shown as "Posted on" links; key → label. Unlisted keys are
  # ignored. (A page's `mastodon:` is a post; params.mastodon is the profile.)
  [params.sources]
    facebook = "Facebook"
    twitter = "Twitter"
    substack = "Substack"
    mastodon = "Mastodon"
    github = "GitHub"

[markup]
  # render-image.html adds the <p> back, except around note embeds (a <div>).
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.renderHooks.link]
    # Resolves relative `.md` links (Obsidian style) to page URLs.
    useEmbedded = "fallback"
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    tabWidth = 4

# HTML only: naming formats keeps Hugo's default RSS off. (The page index is an
# asset, see site-index.html, not an output format.)
[outputs]
  home = ["html"]
  section = ["html"]
  term = ["html"]

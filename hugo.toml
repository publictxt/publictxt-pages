baseURL = "https://PublicTxt.net/"
title = "A PublicTxt instance"
enableRobotsTXT = true
capitalizeListTitles = false

# Content is a union of two directories:
#   build/content  — generated by scripts/sync_content.py from a PublicTxt source repo
#                    (default: example/txt). Never edit by hand; re-sync instead.
#   site-content   — pages that belong to the site itself (search), not the content repo.
[module]
  [[module.mounts]]
    source = "build/content"
    target = "content"
  [[module.mounts]]
    source = "site-content"
    target = "content"

# Section folders (wiki, blog, notes, bookmarks) become sections natively.
# `type:` in front matter overrides the folder-derived default (Hugo .Type).

# The sync step writes `created:` and `updated:` on every page (see
# docs/wiki/features/dates.md). Hugo sorts and renders from .Date / .Lastmod,
# so map them.
[frontmatter]
  date = ["created"]
  lastmod = ["updated", "created"]
  publishDate = ["created"]

[taxonomies]
  tag = "tags"

[params]
  description = "A PublicTxt repository — browsable, searchable, plain-text first."
  # Optional short site title shown in the mobile header.
  shortTitle = "PublicTxt"
  # Relative URL or file path to the favicon; a publishing site can override this,
  # or replace static/favicon.svg outright to change the default.
  favicon = "favicon.png"
  # Optional Mastodon profile URL. Rendered in the footer as <a rel="me">,
  # which Mastodon's profile verification looks for on this site.
  # Example: "https://mastodon.social/@username"
  mastodon = "https://hachyderm.io/@jaysen"

  # Footer wording (layouts/_partials/footer.html). Both optional; omit for the
  # defaults shown, or set to "" to hide a line.
  #   text     markdown, inline
  #   contact  lead-in before the Mastodon link; only shown when `mastodon` is set
  [params.footer]
    text = "PublicTxt, plain-text knowledge, published with [publictxt-pages](https://github.com/publictxt/publictxt-pages)."
    contact = "Reach me on"

  # Order of sections in the sidebar and on the home page (folder names).
  # Sections not listed here follow, alphabetically.
  sectionOrder = ["blog", "wiki", "posts", "notes", "bookmarks"]
  # Number of tags shown in the sidebar tag cloud
  tagCloudLimit = 30
  # Number of pages in the home page's Recent list
  recentLimit = 8
  # Browse lists (section and tag pages) are rendered client-side from each
  # page's index.json, with sort, tag/type filters and paging in the URL.
  # Default sort: "<field> [asc|desc]", field one of
  #   created  (newest first)
  #   title    (A→Z)
  #   updated  (recently updated first — what the home Recent list always uses)
  # and default cards per page. A section's index page overrides either for
  # itself and its sub-folders with `order:` / `perPage:` in its front matter
  # (e.g. `order: title` on wiki/index.md).
  listOrder = "created"
  listPerPage = 20

[markup]
  [markup.goldmark.renderHooks.link]
    # Embedded link render hook: resolves relative `.md` link destinations
    # (Obsidian "relative path to file" links) to page URLs natively.
    useEmbedded = "fallback"
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    tabWidth = 4

# Browse lists read one site-wide page index, published as a fingerprinted
# asset rather than a per-page output format — see
# layouts/_partials/site-index.html and assets/js/site-index.js.
#
# List pages render HTML only. Naming the formats explicitly keeps Hugo's
# default RSS off, which listing ["html", "json"] here used to do implicitly.
[outputs]
  home = ["html"]
  section = ["html"]
  term = ["html"]

# Pipeline tests (tests/, stdlib unittest) and the map check on every push and PR.
# Oldest supported Python on Linux, newest on Windows (CRLF output).

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # test_site.py builds with Hugo (skipped without it); same version as the deploy template, the oldest supported (README, setup.md).
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
      - run: python -m unittest -v
      - run: python scripts/map_lint.py

  js:
    # Browser modules' pure logic (tests/js/); no packages, so no npm install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.mjs"

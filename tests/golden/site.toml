# Site settings for publictxt-pages, merged over its hugo.toml at build time.
# Tables merge key by key; a list (e.g. [[params.chipFacets]]) replaces the
# default whole. Meant for title, baseURL and [params]; the deploy
# workflow's HUGO_* env vars override this file. Overriding mounts or
# contentDir breaks the build. Uncomment to use.

# title = "My notes"

[params]
  # Folders (from the repo root) left out whole: notes and attachments.
  # The example's settings/Templates (Obsidian templates) stays off the site.
  excludeFolders = ["settings/Templates"]
  # File names (any folder) left out; replaces hugo.toml's default list, so
  # CNAME and .gitignore are repeated. The example's README is about the repo.
  skipFiles = ["CNAME", ".gitignore", "README.md"]
  # A `# Heading` on a note's first line is its title (removed from the body).
  # false: the file name is the title, the heading stays. `title:` beats both.
#   titleFromHeading = false
#   description = "Plain-text notes, published."
#   sectionOrder = ["blog", "wiki", "notes"]


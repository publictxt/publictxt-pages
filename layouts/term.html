{{ define "main" }}
<header class="list-header">
  <h1><span class="muted">#</span>{{ .Title }}</h1>
  <p class="muted">{{ len .Pages }} page{{ if ne (len .Pages) 1 }}s{{ end }} tagged
    — <a href="{{ "search/" | relURL }}?tag={{ .Data.Term | urlquery }}">combine with other tags in search</a>.</p>
</header>
<section class="list-recent">
  <h2>Recent <span class="muted">(newest first)</span></h2>
  {{ partial "page-list.html" (dict "pages" .Pages.ByDate.Reverse) }}
</section>
{{ end }}

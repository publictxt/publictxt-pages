<!DOCTYPE html>
<html lang="en" data-base="{{ "/" | relURL }}" data-index="{{ partialCached "site-index.html" . }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">
        <img class="site-logo" src="{{ "logo.png" | relURL }}" alt="{{ site.Title }} logo">
        <span>{{ site.Title }}</span>
      </a>
      <form class="header-search" action="{{ "search/" | relURL }}" method="get" role="search">
        <input type="search" name="q" placeholder="Search…" aria-label="Search the site">
      </form>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      {{ partial "sidebar.html" . }}
    </aside>
    <main class="content">
      {{ partial "breadcrumbs.html" . }}
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <footer class="site-footer">
    <p>{{ site.Title }} - plain-text knowledge, published with <a href="https://github.com/publictxt/txt-hugo">publictxt-hugo</a>.</p>
  </footer>
</body>
</html>

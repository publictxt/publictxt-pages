{{ define "main" }}
<article class="single" data-pagefind-body>
  <header class="single-header">
    <h1>{{ .Title }}</h1>
    {{ partial "pagefind-sort.html" . }}
    <div class="single-meta">
      <span class="chip chip-type" data-pagefind-filter="type">{{ .Type }}</span>
      {{ partial "page-date.html" (dict "page" . "detail" true) }}
      {{ range .GetTerms "tags" }}
      <a class="chip" href="{{ .RelPermalink }}" data-pagefind-filter="tag">{{ .LinkTitle }}</a>
      {{ end }}
    </div>
    {{ partial "bookmark-links.html" . }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
